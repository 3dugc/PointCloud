name: Validate packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: unity-packages
          path: dist/
